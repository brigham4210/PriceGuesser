name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.14.3"

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # Chaquopy needs a build-machine Python matching the app's Python (3.12).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Set up signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          [ -n "$APP_VERSION" ] || unset APP_VERSION
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            gradle -p android assembleRelease
            cp android/app/build/outputs/apk/release/app-release.apk PriceGuesser.apk
          else
            echo "No signing key available; building a debug APK."
            gradle -p android assembleDebug
            cp android/app/build/outputs/apk/debug/app-debug.apk PriceGuesser.apk
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: PriceGuesser-apk
          path: PriceGuesser.apk
          if-no-files-found: error

  android-smoke-test:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: PriceGuesser-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch the app and load the home page
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r PriceGuesser.apk
            adb shell am start -W -n com.brigham4210.priceguesser/.MainActivity
            adb forward tcp:8765 tcp:8765
            for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/ -o home.html && break; sleep 2; done
            grep -q "Price Guesser" home.html
            curl -sf http://127.0.0.1:8765/static/css/style.css -o /dev/null
            adb shell pidof com.brigham4210.priceguesser
            sleep 10
            adb exec-out screencap -p > screenshot.png
            adb logcat -d -s python.stdout python.stderr PriceGuesser > logcat.txt
            grep -q "GET /static/favicon.svg" logcat.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-smoke-test-output
          path: |
            screenshot.png
            logcat.txt
            home.html
          if-no-files-found: ignore

  # Pushing v1.2.0 publishes the "Android v1.2.0" release (tag android-v1.2.0) with the APK.
  release-android:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, android-smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: PriceGuesser-apk
      - name: Publish the Android release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          tag="android-${VERSION}"
          file="PriceGuesser-${VERSION}.apk"
          mv PriceGuesser.apk "$file"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" "$file" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$file" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Android ${VERSION}" --latest \
              --notes "PriceGuesser for Android. Download \`${file}\` on your phone and open it to install (Android 7.0+, 64-bit)."
          fi

name: iOS

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Briefcase builds the app for the Python running it; MarkupSafe has iOS wheels for 3.13.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Briefcase
        run: python -m pip install briefcase==0.4.7

      - name: Prepare app sources
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          ios/sync_webapp.sh
          if [ -n "$APP_VERSION" ]; then
            sed -i '' -E "s/^version = \"[^\"]*\"/version = \"${APP_VERSION#v}\"/" ios/pyproject.toml
          fi
          grep '^version' ios/pyproject.toml

      - name: Create the Xcode project
        working-directory: ios
        run: briefcase create iOS --no-input

      - name: Build for the simulator
        working-directory: ios
        run: briefcase build iOS --no-input

      - name: Launch in the simulator and load the home page
        working-directory: ios
        run: |
          app=$(find build -maxdepth 6 -type d -path "*Debug-iphonesimulator/*.app" | head -1)
          bundle_id=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$app/Info.plist")
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if "iOS" in k), reverse=True)
          print(next(d["udid"] for k in runtimes for d in devices[k] if d["name"].startswith("iPhone")))
          ')
          echo "App: $app ($bundle_id), simulator: $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" "$bundle_id"
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/ -o ../ios-home.html && break; sleep 2; done
          grep -q "Price Guesser" ../ios-home.html
          sleep 15
          xcrun simctl io "$udid" screenshot ../ios-screenshot.png
          xcrun simctl spawn "$udid" log show --last 10m --style compact \
            --predicate 'eventMessage CONTAINS "HTTP/1.1"' > ../ios-log.txt || true
          # This script never fetches the stylesheet, so its request shows the page loaded in the app.
          grep -q "GET /static/css/style.css" ../ios-log.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-smoke-test-output
          path: |
            ios-screenshot.png
            ios-log.txt
            ios-home.html
          if-no-files-found: ignore

      # Unsigned app: sideloading tools (AltStore, Sideloadly) sign it with your Apple ID.
      # Briefcase's build phase still signs the Python frameworks, so give it an ad-hoc identity.
      - name: Build the unsigned IPA
        working-directory: ios
        run: |
          project=$(find build -maxdepth 5 -name "*.xcodeproj" | head -1)
          xcodebuild build -project "$project" -configuration Release \
            -sdk iphoneos -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY=- -quiet
          app=$(find build -maxdepth 6 -type d -path "*Release-iphoneos/*.app" | head -1)
          echo "Packaging $app"
          rm -rf Payload && mkdir Payload && cp -R "$app" Payload/
          zip -qry ../PriceGuesser.ipa Payload
          ls -l ../PriceGuesser.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: PriceGuesser-ipa
          path: PriceGuesser.ipa
          if-no-files-found: error

  # Pushing v1.2.0 publishes the "iOS v1.2.0" release (tag ios-v1.2.0) with the IPA.
  release-ios:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: PriceGuesser-ipa
      - name: Publish the iOS release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          tag="ios-${VERSION}"
          file="PriceGuesser-${VERSION}.ipa"
          mv PriceGuesser.ipa "$file"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" "$file" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$file" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "iOS ${VERSION}" --latest=false \
              --notes "PriceGuesser for iOS (unsigned, for personal use). Sideload \`${file}\` with Sideloadly or AltStore using your Apple ID; see the README for steps."
          fi

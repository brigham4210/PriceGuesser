# Briefcase config for the iOS app. Run ./sync_webapp.sh first; see README.
[tool.briefcase]
project_name = "PriceGuesser"
bundle = "io.github.brigham4210"
version = "1.2.0"  # CI sets this from the release tag
url = "https://github.com/brigham4210/PriceGuesser"
license.file = "LICENSE"
author = "brigham4210"

[tool.briefcase.app.priceguesser]
formal_name = "Price Guesser"
description = "Guess the prices of real Zillow listings."
icon = "icons/priceguesser"
sources = ["src/priceguesser", "src/pgweb"]
# Keep in step with ../requirements.txt
requires = [
    "beautifulsoup4==4.15.0",
    "Flask==3.1.3",
    "requests==2.34.2",
]

[tool.briefcase.app.priceguesser.iOS]
requires = [
    "toga-iOS==0.5.7",
    "std-nslog~=2.0",
]
splash_background_color = "#0B5FFF"
# The game runs on http://127.0.0.1 inside the app.
info."NSAppTransportSecurity" = { NSAllowsLocalNetworking = true }
